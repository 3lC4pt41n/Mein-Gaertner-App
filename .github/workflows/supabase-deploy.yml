name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tsllrwaixvhuadrfsskt

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Repair already-applied migrations missing from tracking
        run: |
          supabase migration repair --status applied 20250101
          supabase migration repair --status applied 20260321

      - name: Push database migrations
        id: db_push
        continue-on-error: true
        run: supabase db push

      - name: Warn if db push failed
        if: steps.db_push.outcome == 'failure'
        run: echo "::warning::supabase db push failed — check migration drift. Edge Functions will still deploy."

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy ai-plant-scan --no-verify-jwt
          supabase functions deploy ai-plant-details --no-verify-jwt
          supabase functions deploy ai-healthcheck --no-verify-jwt
          supabase functions deploy ai-chat --no-verify-jwt
          supabase functions deploy ai-gardener-avatar --no-verify-jwt
          supabase functions deploy revenucat-webhook --no-verify-jwt
          supabase functions deploy privacy-policy --no-verify-jwt
          supabase functions deploy weather-proxy --no-verify-jwt
          supabase functions deploy delete-account --no-verify-jwt
