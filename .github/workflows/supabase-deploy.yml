name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tsllrwaixvhuadrfsskt

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Repair baseline migration (already applied before migration tracking)
        run: supabase migration repair --status applied 20250101

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy ai-plant-scan
          supabase functions deploy ai-plant-details
          supabase functions deploy ai-healthcheck
          supabase functions deploy ai-chat
          supabase functions deploy ai-gardener-avatar
          supabase functions deploy revenucat-webhook --no-verify-jwt
          supabase functions deploy privacy-policy --no-verify-jwt
          supabase functions deploy weather-proxy
          supabase functions deploy delete-account
