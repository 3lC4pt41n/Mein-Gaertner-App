name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tsllrwaixvhuadrfsskt

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Set public function configuration
        run: |
          supabase secrets set SEND_EMAIL_FROM='FloraPilot <noreply@florapilot.app>'
          supabase secrets set SITE_URL='https://florapilot.app'

      - name: Repair already-applied migrations missing from tracking
        run: |
          supabase migration repair --status applied 20250101
          supabase migration repair --status reverted 20260307 20260307210744 20260309114332 20260311144441 20260321

      - name: Push database migrations
        id: db_push
        run: supabase db push --include-all

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy ai-plant-scan --no-verify-jwt
          supabase functions deploy ai-plant-details --no-verify-jwt
          supabase functions deploy ai-healthcheck --no-verify-jwt
          supabase functions deploy ai-chat --no-verify-jwt
          supabase functions deploy ai-gardener-avatar --no-verify-jwt
          supabase functions deploy revenucat-webhook --no-verify-jwt
          supabase functions deploy stripe-create-checkout --no-verify-jwt
          supabase functions deploy stripe-create-portal --no-verify-jwt
          supabase functions deploy stripe-webhook --no-verify-jwt
          supabase functions deploy privacy-policy --no-verify-jwt
          supabase functions deploy weather-proxy --no-verify-jwt
          supabase functions deploy android-waitlist --no-verify-jwt
          supabase functions deploy delete-account --no-verify-jwt
          supabase functions deploy send-email --no-verify-jwt
          supabase functions deploy terms --no-verify-jwt
