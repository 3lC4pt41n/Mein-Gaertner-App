name: Deploy Cloudflare Web App

on:
  push:
    branches:
      - main
    paths:
      - App.js
      - index.js
      - app.config.js
      - app.json
      - package.json
      - package-lock.json
      - .nvmrc
      - wrangler.toml
      - assets/**
      - components/**
      - contexts/**
      - i18n/**
      - public/**
      - screens/**
      - scripts/ensure-web-redirects.js
      - services/**
      - supabase.js
      - theme/**
      - utils/**
      - .github/workflows/cloudflare-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_WEB_APP_URL: ${{ secrets.EXPO_PUBLIC_WEB_APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Expo web app
        run: npm run export:web

      - name: Verify Cloudflare Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test "$(cat dist/_redirects)" = "/* /index.html 200"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=florascout-web
