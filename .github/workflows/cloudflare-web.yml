name: Deploy Cloudflare Web App

on:
  push:
    branches:
      - main
    paths:
      - App.js
      - index.js
      - app.config.js
      - app.json
      - package.json
      - package-lock.json
      - .nvmrc
      - wrangler.toml
      - assets/**
      - components/**
      - contexts/**
      - i18n/**
      - public/**
      - screens/**
      - scripts/ensure-web-redirects.js
      - services/**
      - supabase.js
      - theme/**
      - utils/**
      - .github/workflows/cloudflare-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_WEB_APP_URL: ${{ secrets.EXPO_PUBLIC_WEB_APP_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Expo web app
        run: npm run export:web

      - name: Verify Cloudflare Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test "$(cat dist/_redirects)" = "/* /index.html 200"

      - name: Report skipped Cloudflare deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.EXPO_PUBLIC_SUPABASE_URL == '' || env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY == '' || env.EXPO_PUBLIC_WEB_APP_URL == ''
        run: |
          echo "::notice::Skipping Cloudflare deploy because one or more required GitHub Secrets are not configured."

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.EXPO_PUBLIC_SUPABASE_URL != '' && env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' && env.EXPO_PUBLIC_WEB_APP_URL != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            wrangler pages project create florapilot-web --production-branch=main || true
          command: pages deploy dist --project-name=florapilot-web
