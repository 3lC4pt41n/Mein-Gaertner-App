name: EAS OTA Update

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - '.github/**'
      - '*.md'
      - 'email-templates/**'

jobs:
  update:
    name: OTA Update (production)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Design token guard
        run: npm run lint:tokens

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - run: npm test

      - name: Pull and verify OTA environment
        run: |
          eas env:pull production --path .env.local --non-interactive
          grep -Eq '^EXPO_PUBLIC_SUPABASE_URL=.+$' .env.local
          grep -Eq '^EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=.+$' .env.local

      - name: Publish OTA update
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          eas update --channel production --platform ios --environment production --message "$FIRST_LINE" --non-interactive
          eas update --channel production --platform android --environment production --message "$FIRST_LINE" --non-interactive
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
