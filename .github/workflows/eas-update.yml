name: EAS OTA Update

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - '.github/**'
      - '*.md'
      - 'email-templates/**'

jobs:
  update:
    name: OTA Update (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Design token guard
        run: npm run lint:tokens

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm test

      - name: Publish OTA update
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          eas update --channel production --platform ios --message "$FIRST_LINE" --non-interactive
          eas update --channel production --platform android --message "$FIRST_LINE" --non-interactive
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
