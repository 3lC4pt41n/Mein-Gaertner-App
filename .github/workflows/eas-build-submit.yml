name: EAS Build & Submit

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── 1a. Lint Gate ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings, zero errors)
        run: |
          npx eslint . --max-warnings 0
          npm run lint:tokens

  # ── 1b. Tests ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test

  # ── 2a. Android Build (after lint + test) ──────────────
  build-android:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Build Android
        run: eas build --platform android --profile production --non-interactive

  # ── 2b. iOS Build (after lint + test) ──────────────────
  build-ios:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive

  # ── 3a. Submit to Play Store ───────────────────────────
  submit-android:
    needs: build-android
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Create Google Service Account file
        run: |
          mkdir -p ./_local/credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > ./_local/credentials/google-service-account.json
      - name: Submit to Play Store (Internal)
        run: eas submit --platform android --profile production --latest --non-interactive

  # ── 3b. Submit to App Store ────────────────────────────
  submit-ios:
    needs: build-ios
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Create ASC API Key file
        run: |
          mkdir -p ./_local/credentials
          echo '${{ secrets.ASC_API_KEY_P8 }}' > ./_local/credentials/AuthKey_VQF5PUJ7FN.p8
      - name: Submit to App Store (TestFlight)
        run: eas submit --platform ios --profile production --latest --non-interactive
