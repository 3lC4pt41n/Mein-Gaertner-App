name: EAS Build & Submit

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run tests
        run: npm test

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive

      # Android build requires a keystore to exist on EAS first.
      # Run `eas build --platform android --profile production` locally once,
      # then uncomment the line below for future CI builds.
      # - name: Build Android
      #   run: eas build --platform android --profile production --non-interactive

      - name: Submit to App Store (TestFlight)
        run: eas submit --platform ios --profile production --latest --non-interactive

      # Android submit requires google-service-account.json
      # Uncomment when Play Store service account is configured
      # - name: Submit to Play Store (Internal)
      #   run: eas submit --platform android --profile production --latest --non-interactive
