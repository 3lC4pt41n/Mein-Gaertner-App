# FloraScout — focused home-zones screenshot recapture flow
# Run via scripts/capture-screenshots.js --flow home-zones.
appId: com.elcaptain.digitalergaertner
---
- launchApp:
    clearState: false

- tapOn:
    text: "Nicht erlauben"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Ne pas autoriser"
    optional: true

- runFlow:
    when:
      visible:
        text: "${LBL_EMAIL}"
    commands:
      - tapOn:
          text: "${LBL_EMAIL}"
      - inputText: "${EMAIL}"
      - tapOn:
          text: "${LBL_PASSWORD}"
      - inputText: "${PASSWORD}"
      - tapOn:
          point: "50%,46%"

- tapOn:
    text: "Nicht erlauben"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Ne pas autoriser"
    optional: true

- extendedWaitUntil:
    visible:
      text: "${TAB_HOME_RE}"
    timeout: 60000

- tapOn:
    text: "${TAB_HOME_RE}"
- extendedWaitUntil:
    visible:
      text: "${LOCATION_NAME_RE}"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        text: "${ZONE_NAME_RE}"
    commands:
      - tapOn:
          point: "86%,45%"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      text: "${ZONE_NAME_RE}"
    timeout: 15000
- takeScreenshot: "${SHOT_DIR}/home-zones"
