# FloraScout — focused plant detail screenshot recapture flow
# Run via scripts/capture-screenshots.js --flow details.
appId: com.elcaptain.digitalergaertner
---
- launchApp:
    clearState: false

- tapOn:
    text: "Nicht erlauben"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Ne pas autoriser"
    optional: true

- runFlow:
    when:
      visible:
        text: "${LBL_EMAIL}"
    commands:
      - tapOn:
          text: "${LBL_EMAIL}"
      - inputText: "${EMAIL}"
      - tapOn:
          text: "${LBL_PASSWORD}"
      - inputText: "${PASSWORD}"
      - tapOn:
          point: "50%,46%"

- tapOn:
    text: "Nicht erlauben"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Ne pas autoriser"
    optional: true

- extendedWaitUntil:
    visible:
      text: "${TAB_HOME_RE}"
    timeout: 60000

- tapOn:
    text: "${TAB_PLANTS_RE}"
- tapOn:
    text: "${TAB_PLANTS_ALL_RE}"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "${PLANT_NAME_RE}"
- extendedWaitUntil:
    visible:
      id: "plant-detail-tab-care"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- swipe:
    from:
      id: "plant-detail-tab-care"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "plant-detail-tab-health"
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${SHOT_DIR}/details-health"

- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    from:
      id: "plant-detail-tab-health"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "plant-detail-tab-care"
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${SHOT_DIR}/details-properties"
